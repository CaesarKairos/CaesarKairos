<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="10" viewBox="0 0 1200 10" role="img" aria-label="Animated Caesar Kairos color divider">
  <defs>
    <linearGradient id="kairos" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#31572C"/>
      <stop offset="25%" stop-color="#40916C"/>
      <stop offset="50%" stop-color="#90A955"/>
      <stop offset="75%" stop-color="#ECF39E"/>
      <stop offset="100%" stop-color="#31572C"/>
    </linearGradient>

    <clipPath id="lineClip">
      <rect x="0" y="0" width="1200" height="10" rx="5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#lineClip)">

    <g opacity="0.30">
      <rect x="-1200" y="2" width="1200" height="6" fill="url(#kairos)"/>
      <rect x="0" y="2" width="1200" height="6" fill="url(#kairos)"/>
      <rect x="1200" y="2" width="1200" height="6" fill="url(#kairos)"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="1200 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>

    <g>
      <rect x="-1200" y="4" width="1200" height="2" fill="url(#kairos)"/>
      <rect x="0" y="4" width="1200" height="2" fill="url(#kairos)"/>
      <rect x="1200" y="4" width="1200" height="2" fill="url(#kairos)"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="1200 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>

  </g>
</svg>